title = "Partially Applied"
description = "The personal blog of Alexander McKenna"
author = "Alexander McKenna"

base_url = "https://partially-applied.com"

default_language = "en"

theme = "apollo"
taxonomies = [{ name = "tags" }]

compile_sass = true
build_search_index = true

[markdown]
bottom_footnotes = true
definition_list = true
external_links_external = true
external_links_no_referrer = true
external_links_target_blank = true
render_emoji = true
smart_punctuation = true

[markdown.highlighting]
error_on_missing_language = true
light_theme = "vitesse-light"
dark_theme = "vitesse-dark"

[search]
include_content = true
include_date = true
include_description = true
include_path = true
include_title = true

[extra]
fancy_code = true
theme = "toggle-auto"
menu = [
  { name = "Posts", url = "/posts", weight = 1 },
  { name = "Tags", url = "/tags", weight = 2 },
]
socials = [
  { name = "GitHub", url = "https://github.com/alex-mckenna", icon = "github" },
]

[extra.taxonomies]
sort_by = "page_count"
reverse = true
