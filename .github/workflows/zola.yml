name: "Deploy Zola site to Pages"

on:
  push:
    branches:
      - "main"

  # Allow running the workflow manually
  workflow_dispatch:

permissions:
  contents: "read"
  id-token: "write"
  pages: "write"

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

jobs:
  build:
    runs-on: "ubuntu-latest"
    env:
      ZOLA_VERSION: "v0.22.1"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Zola Build"
        uses: "getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790"
        with:
          zola_version: ${{ env.ZOLA_VERSION }}

  deploy:
    runs-on: "ubuntu-latest"
    needs: "build"
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@v5"
